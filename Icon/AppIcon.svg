<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2702F"/>
      <stop offset="1" stop-color="#9A4F1B"/>
    </linearGradient>
  </defs>

  <!-- Icon body: 824 px rounded square inside the 1024 canvas (macOS template) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>

  <!-- Page, with a soft stacked shadow -->
  <rect x="250" y="210" width="524" height="644" rx="44" fill="#000" opacity="0.08"/>
  <rect x="250" y="198" width="524" height="644" rx="44" fill="#000" opacity="0.10"/>
  <rect x="250" y="190" width="524" height="644" rx="44" fill="#FAF9F7"/>

  <!-- Highlighted line of text -->
  <rect x="424" y="418" width="320" height="48" rx="14" fill="#A3561E" opacity="0.20"/>

  <!-- Lines of text -->
  <g fill="#DDD6CF">
    <rect x="440" y="286" width="290" height="24" rx="12"/>
    <rect x="440" y="358" width="250" height="24" rx="12"/>
    <rect x="440" y="430" width="290" height="24" rx="12"/>
    <rect x="440" y="502" width="270" height="24" rx="12"/>
    <rect x="440" y="574" width="200" height="24" rx="12"/>
    <rect x="440" y="646" width="290" height="24" rx="12"/>
    <rect x="440" y="718" width="150" height="24" rx="12"/>
  </g>

  <!-- Margin line -->
  <line x1="400" y1="246" x2="400" y2="778" stroke="#A3561E" stroke-width="8" stroke-linecap="round"/>

  <!-- The note in the margin, anchored to the highlighted line -->
  <rect x="290" y="422" width="90" height="18" rx="9" fill="#A3561E"/>
  <rect x="290" y="450" width="58" height="18" rx="9" fill="#A3561E"/>
  <circle cx="400" cy="442" r="18" fill="#A3561E" stroke="#FAF9F7" stroke-width="6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
