# Generates Xueji.xcodeproj (run `xcodegen generate`). The project is a build artifact: do not edit or commit it.
# Change targets, settings and permissions here.
name: Xueji
options:
  bundleIdPrefix: dev.xueji   # TODO: replace with your own reverse-DNS prefix
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Xueji:
    path: .
targets:
  Xueji:
    type: application
    platform: macOS
    sources:
      - path: Sources/XuejiApp
        excludes:
          - Resources/AppIcon.png   # only used to set the Dock icon of the SwiftPM build
      - path: Xcode/Assets.xcassets
    dependencies:
      - package: Xueji
        product: XuejiCore
    info:
      path: Xcode/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: "14.0"
        # Needed by the Calendar integration (EventKit), planned.
        NSCalendarsFullAccessUsageDescription: Xueji shows your deadlines in the Calendar app and reads your events so you can plan around them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xueji.Xueji
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
