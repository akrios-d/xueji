# Generates Xueji.xcodeproj (run `xcodegen generate`, XcodeGen 2.44 or newer). The generated project and Xcode/Info.plist
# are committed so the app opens in Xcode without XcodeGen. Source files do not need a new run: Sources/XuejiApp is a
# synchronized folder. Run it again only after changing targets, settings or permissions here, and commit the result.
name: Xueji
options:
  bundleIdPrefix: dev.xueji   # TODO: replace with your own reverse-DNS prefix
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Xueji:
    path: .
targets:
  Xueji:
    type: application
    platform: macOS
    sources:
      # A synchronized folder (Xcode 16): every file added, moved or deleted in this folder is part of the app at once,
      # with no need to regenerate the project. (AppIcon.png is only for the SwiftPM build; here it is just a spare resource.)
      - path: Sources/XuejiApp
        type: syncedFolder
      - path: Xcode/Assets.xcassets
    dependencies:
      - package: Xueji
        product: XuejiCore
    info:
      path: Xcode/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: "14.0"
        # Needed by the Calendar integration (EventKit), planned.
        NSCalendarsFullAccessUsageDescription: Xueji shows your deadlines in the Calendar app and reads your events so you can plan around them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xueji.Xueji
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
# One shared scheme for the app, committed with the project, so Xcode always offers the app (a real .app) and
# never only the Swift package's command-line executable.
schemes:
  Xueji:
    build:
      targets:
        Xueji: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
